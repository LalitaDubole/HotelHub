[phases.setup]
nixPkgs = ["php", "phpExtensions.pdo", "phpExtensions.pdo_mysql", "phpExtensions.mbstring", "phpExtensions.xml", "phpExtensions.curl", "phpExtensions.zip", "phpExtensions.tokenizer", "composer"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"